name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Wait for successful CI run for this commit
        id: ci_run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = "ci.yaml";
            const sha = context.sha;
            const maxAttempts = 40;
            const delayMs = 15000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const res = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: "push",
                head_sha: sha,
                per_page: 20
              });

              const runs = res.data.workflow_runs || [];
              const successRun = runs.find((run) => run.status === "completed" && run.conclusion === "success");
              if (successRun) {
                core.info(`Using CI run ${successRun.id}`);
                core.setOutput("id", String(successRun.id));
                return;
              }

              const failedRun = runs.find((run) => run.status === "completed" && run.conclusion !== "success");
              if (failedRun) {
                core.setFailed(`CI run ${failedRun.id} for ${sha} completed with conclusion=${failedRun.conclusion}`);
                return;
              }

              core.info(`No completed successful CI run for ${sha} yet (attempt ${attempt}/${maxAttempts}); waiting...`);
              await new Promise((resolve) => setTimeout(resolve, delayMs));
            }

            core.setFailed(`Timed out waiting for successful CI run for ${sha}.`);

      - name: Download CI binary artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.ci_run.outputs.id }}
          name: websyncd-linux-amd64
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker build context
        run: |
          cp dist/websyncd-linux-amd64 websyncd
          chmod +x websyncd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.tag }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
