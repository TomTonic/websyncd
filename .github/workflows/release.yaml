name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit from CI run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        run: |
          git fetch --tags --force
          TAG="$(git tag --points-at HEAD | head -n 1)"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No tag found on commit ${GITHUB_SHA}; skipping release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download CI artifact
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: websyncd-linux-amd64
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker build context
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          cp dist/websyncd-linux-amd64 websyncd
          chmod +x websyncd

      - name: Set up Docker Buildx
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ steps.meta.outputs.skip != 'true' }}
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.tag }}

      - name: Build and push image
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
