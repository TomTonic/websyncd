name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/websyncd-linux-amd64 ./cmd/websyncd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/websyncd-linux-arm64 ./cmd/websyncd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o dist/websyncd-linux-armv7 ./cmd/websyncd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -o dist/websyncd-linux-armv6 ./cmd/websyncd

      - name: Verify built binaries
        run: |
          test -s dist/websyncd-linux-amd64
          test -s dist/websyncd-linux-arm64
          test -s dist/websyncd-linux-armv7
          test -s dist/websyncd-linux-armv6
          file dist/websyncd-linux-amd64 | grep -q "x86-64"
          file dist/websyncd-linux-arm64 | grep -qi "aarch64\|arm64"
          file dist/websyncd-linux-armv7 | grep -qi "arm"
          file dist/websyncd-linux-armv6 | grep -qi "arm"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: websyncd-linux-binaries
          path: dist/websyncd-linux-*
