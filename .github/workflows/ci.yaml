name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/websyncd-linux-amd64 ./cmd/websyncd

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: websyncd-linux-amd64
          path: dist/websyncd-linux-amd64
